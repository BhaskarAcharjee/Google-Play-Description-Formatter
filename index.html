<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Play Store Description Formatter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <h1>Google Play Description Formatter</h1>

    <div class="container">
      <!-- Markdown Input -->
      <div class="panel">
        <h2>Rich Editor (Paste from Word)</h2>

        <div class="toolbar">
          <button onclick="format('bold')"><b>B</b></button>
          <button onclick="format('italic')"><i>I</i></button>
          <button onclick="format('underline')"><u>U</u></button>
          <button onclick="wrapTag('blockquote')">❝</button>
          <button onclick="wrapTag('small')">Small</button>
          <button onclick="wrapTag('big')">Big</button>
          <button onclick="format('superscript')">Sup</button>
          <button onclick="format('subscript')">Sub</button>
          <div class="color-picker">
            <button onclick="togglePalette()">🎨</button>
            <div id="palette" class="palette hidden">
              <span data-color="#000000" style="--c: #000000"></span>
              <span data-color="#444444" style="--c: #444444"></span>
              <span data-color="#1f2937" style="--c: #1f2937"></span>
              <span data-color="#a32345" style="--c: #a32345"></span>
              <span data-color="#dc2626" style="--c: #dc2626"></span>
              <span data-color="#16a34a" style="--c: #16a34a"></span>
              <span data-color="#2563eb" style="--c: #2563eb"></span>
              <span data-color="#7c3aed" style="--c: #7c3aed"></span>
            </div>
          </div>
        </div>

        <div
          id="editor"
          class="editor"
          contenteditable="true"
          placeholder="Paste from Word or type here..."
        ></div>
        <div class="char-counter">
          <span id="shortCount">Short: 0 / 80</span>
          <span id="longCount">Long: 0 / 4000</span>
        </div>
      </div>

      <!-- Preview -->
      <div class="panel phone-panel">
        <h2>Live Preview (Mobile)</h2>

        <div class="mobile-phone">
          <div class="brove"><span class="speaker"></span></div>
          <div class="screen">
            <div id="preview" class="preview phone-preview"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Output -->
    <div class="output panel">
      <h2>Final Play Store Output (Copy This)</h2>
      <textarea id="output" readonly></textarea>

      <div class="buttons">
        <button onclick="copyOutput()">Copy</button>
        <button class="secondary" onclick="resetAll()">Reset</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
