<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Play Store Description Formatter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <h1>Google Play Description Formatter</h1>

    <div class="container">
      <!-- Markdown Input -->
      <div class="panel">
        <h2>Rich Editor (Paste from Word)</h2>

        <div class="toolbar">
          <button onclick="format('bold')"><b>B</b></button>
          <button onclick="format('italic')"><i>I</i></button>
          <button onclick="format('underline')"><u>U</u></button>
          <button onclick="wrapTag('blockquote')">❝</button>
          <button onclick="wrapTag('small')">Small</button>
          <button onclick="wrapTag('big')">Big</button>
          <button onclick="format('superscript')">Sup</button>
          <button onclick="format('subscript')">Sub</button>
          <button onclick="applyColor()">🎨</button>
        </div>

        <div
          id="editor"
          class="editor"
          contenteditable="true"
          placeholder="Paste from Word or type here..."
        ></div>
      </div>

      <!-- Preview -->
      <div class="panel phone-panel">
        <h2>Live Preview (Mobile)</h2>

        <div class="mobile-phone">
          <div class="brove"><span class="speaker"></span></div>
          <div class="screen">
            <div id="preview" class="preview phone-preview"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Output -->
    <div class="output panel">
      <h2>Final Play Store Output (Copy This)</h2>
      <textarea id="output" readonly></textarea>

      <div class="buttons">
        <button onclick="copyOutput()">Copy</button>
        <button class="secondary" onclick="resetAll()">Reset</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
